<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL:AutoForm | Masuk</title>
  <meta name="description" content="Portal administrasi dan pelaporan otomatis berbasis NIP Guru dan Manajemen Cloud Firebase.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="asset/image/logo-smkn1jetis.webp">

  <!-- Early Theme Detection Guard (Auto System / Saved) -->
  <script>
    (function() {
      const saved = localStorage.getItem('portal_theme');
      const isLight = saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (isLight) {
        document.documentElement.classList.add('theme-light-init');
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.remove('dark-mode');
          document.body.classList.add('light-mode');
        });
      }
    })();
  </script>

  <link rel="stylesheet" href="asset/css/style.css">
</head>
<body class="dark-mode landing-page">

  <!-- Background Ambient Glow Effects -->
  <div class="bg-glow-container" aria-hidden="true">
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>
    <div class="glow-sphere glow-3"></div>
  </div>

  <!-- App Wrapper -->
  <div class="app-wrapper">

    <!-- Top Header -->
    <header class="main-header" id="app-main-header">
      <div class="brand-container">
        <a href="./" class="brand-link">
          <div class="brand-icon brand-logo-circle">
            <img src="asset/image/logo-smkn1jetis.webp" alt="Logo SMKN 1 Jetis" class="brand-logo-img" width="36" height="36">
          </div>
          <div class="brand-text">
            <h1 class="brand-title">PORTAL<span class="brand-accent">:AutoForm</span></h1>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" title="Ganti Tema Terang/Gelap" aria-label="Ganti Tema">
          <i class="fa-solid fa-sun light-icon"></i>
          <i class="fa-solid fa-moon dark-icon"></i>
        </button>
      </div>
    </header>

    <!-- Main Content Area: Focused Teacher Login -->
    <main class="content-area landing-content-centered">
      
      <div class="landing-hero-card">
        
        <!-- Circular SMK Logo Badge -->
        <div class="school-logo-wrapper">
          <img src="asset/image/logo-smkn1jetis.webp" alt="Logo SMKN 1 Jetis Mojokerto" class="school-logo-img" width="96" height="96" fetchpriority="high">
        </div>

        <div class="landing-text-header">
          <span class="school-badge-pill">SMKN 1 JETIS MOJOKERTO</span>
          <h2 class="landing-title">Portal AutoFill Google Form</h2>
          <p class="landing-author">Created by Iskak Fatoni</p>
        </div>

        <!-- GURU (Input NIP) -->
        <form id="form-landing-nip" class="landing-nip-form" autocomplete="off">
          <div class="landing-input-box">
            <i class="fa-solid fa-id-card input-box-icon"></i>
            <input 
              type="text" 
              id="landing-nip-input" 
              class="landing-nip-input font-mono" 
              placeholder="Masukkan 18 Digit NIP Anda..." 
              maxlength="25" 
              autofocus 
              required
            >
          </div>
          <button type="submit" class="btn btn-primary btn-landing-go btn-landing-submit" id="btn-landing-go">
            <span>MASUK</span> <i class="fa-solid fa-right-to-bracket"></i>
          </button>
          <div id="landing-nip-error" class="landing-error-msg hidden">
            <i class="fa-solid fa-circle-exclamation"></i> NIP tidak ditemukan di database. Pastikan digit NIP sudah benar.
          </div>
        </form>

      </div>

    </main>

  </div>

  <script type="module" src="asset/js/login.js?v=2.0.1"></script>
</body>
</html>
