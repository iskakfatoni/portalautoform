<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PORTAL:AutoForm</title>
  <meta name="description" content="Portal administrasi dan pelaporan otomatis berbasis NIP Guru dan Manajemen Cloud Firebase.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <link rel="stylesheet" href="asset/css/style.css">
</head>
<body class="dark-mode">

  <!-- Background Ambient Glow Effects -->
  <div class="bg-glow-container" aria-hidden="true">
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>
    <div class="glow-sphere glow-3"></div>
  </div>

  <!-- App Wrapper -->
  <div class="app-wrapper">

    <!-- Top Header -->
    <header class="main-header" id="app-main-header">
      <div class="brand-container">
        <a href="./" class="brand-link">
          <div class="brand-icon">
            <i class="fa-solid fa-bolt-lightning"></i>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">PORTAL<span class="brand-accent">:AutoForm</span></h1>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" title="Ganti Tema Terang/Gelap" aria-label="Ganti Tema">
          <i class="fa-solid fa-sun light-icon"></i>
          <i class="fa-solid fa-moon dark-icon"></i>
        </button>
      </div>
    </header>

    <!-- Main Content Area: Focused Login Box -->
    <main class="content-area" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px);">
      
      <div class="landing-hero-card" style="width: 100%; max-width: 480px; margin: 0 auto;">
        
        <!-- Icon Badge -->
        <div class="landing-icon-badge">
          <i class="fa-solid fa-id-card-clip"></i>
        </div>

        <div class="landing-text-header">
          <h2 class="landing-title">Selamat Datang</h2>
          <p class="landing-subtitle">Pilih opsi login untuk mengakses formulir dan administrasi otomatis.</p>
        </div>

        <!-- Auth Mode Switcher Tabs -->
        <div class="auth-tabs" style="display: flex; background: rgba(0,0,0,0.25); border-radius: var(--radius-md); padding: 4px; margin-bottom: 20px; gap: 4px;">
          <button type="button" class="auth-tab-btn active btn-tab-pill" data-target="tab-auth-teacher" style="flex: 1; padding: 10px 14px; border: none; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-user-graduate"></i> Guru (NIP)
          </button>
          <button type="button" class="auth-tab-btn btn-tab-pill" data-target="tab-auth-admin" style="flex: 1; padding: 10px 14px; border: none; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-shield-halved"></i> Administrator
          </button>
        </div>

        <!-- TAB 1: GURU (Input NIP) -->
        <div id="tab-auth-teacher" class="auth-tab-pane active">
          <form id="form-landing-nip" class="landing-nip-form" autocomplete="off">
            <div class="landing-input-box">
              <i class="fa-solid fa-id-card input-box-icon"></i>
              <input 
                type="text" 
                id="landing-nip-input" 
                class="landing-nip-input font-mono" 
                placeholder="Masukkan 18 Digit NIP Anda..." 
                maxlength="25" 
                autofocus 
                required
              >
            </div>
            <button type="submit" class="btn btn-primary btn-landing-go" id="btn-landing-go" style="width: 100%; justify-content: center; padding: 0.95rem;">
              <span>MASUK PORTAL GURU</span> <i class="fa-solid fa-right-to-bracket"></i>
            </button>
            <div id="landing-nip-error" class="landing-error-msg hidden">
              <i class="fa-solid fa-circle-exclamation"></i> NIP tidak ditemukan di database. Pastikan digit NIP sudah benar.
            </div>
          </form>
        </div>

        <!-- TAB 2: ADMIN (Firebase Email/Password & Google) -->
        <div id="tab-auth-admin" class="auth-tab-pane" style="display: none;">
          <form id="admin-login-form" class="admin-auth-form" autocomplete="on">
            <div class="input-group" style="text-align: left; margin-bottom: 14px;">
              <label for="admin-login-email" style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">
                <i class="fa-solid fa-envelope"></i> Email Admin
              </label>
              <input type="email" id="admin-login-email" class="form-control font-mono" placeholder="iskakfatoni@gmail.com" required style="width: 100%;">
            </div>

            <div class="input-group" style="text-align: left; margin-bottom: 18px;">
              <label for="admin-login-password" style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">
                <i class="fa-solid fa-lock"></i> Password
              </label>
              <input type="password" id="admin-login-password" class="form-control" placeholder="Masukkan password admin..." required style="width: 100%;">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="width: 100%; justify-content: center; padding: 0.9rem; font-weight: 700; margin-bottom: 12px;">
              <i class="fa-solid fa-right-to-bracket"></i> MASUK SEBAGAI ADMIN
            </button>

            <button type="button" id="btn-login-google" class="btn btn-secondary btn-block" style="width: 100%; justify-content: center; padding: 0.75rem;">
              <i class="fa-brands fa-google"></i> Masuk dengan Akun Google
            </button>

            <div id="admin-login-error" class="landing-error-msg hidden" style="margin-top: 14px;">
              <i class="fa-solid fa-circle-exclamation"></i> Gagal masuk akun admin.
            </div>
          </form>
        </div>

      </div>

    </main>

  </div>

  <script type="module" src="asset/js/login.js"></script>
</body>
</html>
